<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96"
     role="img" aria-label="HSA Plus">
  <title>HSA Plus</title>
  <defs>
    <linearGradient id="hsaPlusEmerald" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#065f46"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <!-- The H of HSA, built to climb: the right stem stands taller than the left
       and the crossbar is pitched up between them. Corners are milled almost
       square (r=2) rather than rounded, for the precision the brand's design
       philosophy asks for. No cross, no medical read. -->
  <g fill="url(#hsaPlusEmerald)">
    <rect x="16" y="32" width="15" height="50" rx="2"/>
    <rect x="65" y="14" width="15" height="68" rx="2"/>
    <path d="M31,53 L65,37 L65,51 L31,67 Z"/>
  </g>
</svg>
