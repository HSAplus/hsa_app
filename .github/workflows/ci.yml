name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Lint, RLS Guard & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: "Guard: Check Public Schema Tables Have RLS"
        run: npm run check:rls

      - name: "Guard: SQL Dollar-Quote Balance"
        run: npm run check:sql

      - name: "Guard: Advertised Routes Are Publicly Reachable"
        run: npm run check:routes

      - name: "Test: Storage Path Security & Traversal Defense"
        run: npm run test:storage

      - name: "Test: Signup Attribution Channel Derivation"
        run: npm run test:attribution

      - name: Run Linter
        run: npm run lint

      - name: Run Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder' }}
